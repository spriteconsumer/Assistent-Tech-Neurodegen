<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Throwback — Saathi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --senior-bg: #FBF6EC;
    --senior-card: #FFFFFF;
    --senior-ink: #2B2A25;
    --senior-ink-soft: #6B6A5F;
    --senior-teal: #0F6E56;
    --senior-teal-tint: #E1F2EC;
    --senior-red: #A5311E;
    --senior-red-tint: #FBEAE6;
    --senior-border: #E7E0CF;
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--senior-bg);
    color: var(--senior-ink);
    font-family: 'Inter', system-ui, sans-serif;
    padding: 28px 18px 60px;
  }

  .wrap { max-width: 640px; margin: 0 auto; }

  header.top {
    text-align: center;
    margin-bottom: 26px;
  }
  header.top .eyebrow {
    font-size: 12.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--senior-teal);
    font-weight: 700;
    margin-bottom: 6px;
  }
  header.top h1 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 600;
    font-size: 30px;
    margin: 0 0 8px;
  }
  header.top p {
    color: var(--senior-ink-soft);
    font-size: 14.5px;
    margin: 0;
    line-height: 1.5;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 420px) {
    .grid { grid-template-columns: 1fr; }
  }

  .throwback-card {
    position: relative;
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: var(--senior-card);
    border: 1px solid var(--senior-border);
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(43, 42, 37, 0.06);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .throwback-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 26px rgba(43, 42, 37, 0.10);
  }
  .throwback-card:focus-visible {
    outline: 3px solid var(--senior-teal);
    outline-offset: 3px;
  }

  .frame {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;
    overflow: hidden;
  }
  .frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* blur mask over the lower portion of the photo */
  .blur-veil {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 46%;
    overflow: hidden;
  }
  .blur-veil img {
    position: absolute;
    left: 0; bottom: 0;
    width: 100%;
    height: 227%; /* same source image, shifted so the bottom crop aligns */
    object-fit: cover;
    object-position: bottom;
    filter: blur(14px) saturate(1.05);
    transform: scale(1.08);
  }
  .blur-veil::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(43,42,37,0) 0%, rgba(20,19,15,0.35) 100%);
  }

  .tap-hint {
    position: absolute;
    top: 10px; right: 10px;
    background: rgba(251, 246, 236, 0.92);
    color: var(--senior-ink);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 5px 9px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 4px;
    box-shadow: 0 2px 8px rgba(43,42,37,0.12);
  }

  .caption {
    position: absolute;
    left: 12px; right: 12px; bottom: 10px;
    color: #FFFFFF;
    z-index: 2;
  }
  .caption .place {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 600;
    font-size: 16px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.45);
    display: block;
  }
  .caption .sub {
    font-size: 11.5px;
    opacity: 0.92;
    text-shadow: 0 1px 4px rgba(0,0,0,0.45);
  }

  /* ---------- Lightbox ---------- */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(20, 19, 15, 0.82);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 22px;
    z-index: 50;
  }
  .lightbox.open { display: flex; }

  .lightbox-panel {
    background: var(--senior-card);
    border-radius: var(--radius-lg);
    overflow: hidden;
    max-width: 480px;
    width: 100%;
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 24px 60px rgba(0,0,0,0.35);
  }

  .lightbox-photo-wrap {
    position: relative;
    width: 100%;
    max-height: 62vh;
    background: #14130F;
  }
  .lightbox-photo-wrap img {
    width: 100%;
    height: 100%;
    max-height: 62vh;
    object-fit: contain;
    display: block;
  }

  .lightbox-close {
    position: absolute;
    top: 10px; right: 10px;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: none;
    background: rgba(251, 246, 236, 0.92);
    color: var(--senior-ink);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }

  .lightbox-body {
    padding: 18px 20px 22px;
  }
  .lightbox-body .eyebrow {
    font-size: 11.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--senior-teal);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .lightbox-body h2 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 600;
    font-size: 22px;
    margin: 0 0 6px;
  }
  .lightbox-body p {
    margin: 0;
    color: var(--senior-ink-soft);
    font-size: 14px;
    line-height: 1.55;
  }

  .footer-note {
    text-align: center;
    color: var(--senior-ink-soft);
    font-size: 12.5px;
    margin-top: 28px;
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">Saathi · Memories</div>
    <h1>Throwback</h1>
    <p>A little collection from your travels. Tap any photo to relive it.</p>
  </header>

  <div class="grid" id="grid"></div>

  <p class="footer-note">5 memories · tap a photo to open it full size</p>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="lightbox-panel">
    <div class="lightbox-photo-wrap">
      <button class="lightbox-close" id="lightboxClose" aria-label="Close">✕</button>
      <img id="lightboxImg" src="" alt="" />
    </div>
    <div class="lightbox-body">
      <div class="eyebrow" id="lightboxEyebrow">Throwback</div>
      <h2 id="lightboxTitle"></h2>
      <p id="lightboxSub"></p>
    </div>
  </div>
</div>

  const grid = document.getElementById('grid');
  grid.innerHTML = MEMORIES.map((m) => `
    <div class="throwback-card" tabindex="0" role="button" data-id="${m.id}" aria-label="${m.title}">
      <div class="frame">
        <img src="${m.src}" alt="${m.place}" />
        <div class="blur-veil"><img src="${m.src}" alt="" aria-hidden="true" /></div>
        <span class="tap-hint">👆 tap to view</span>
        <div class="caption">
          <span class="place">${m.place}</span>
          <span class="sub">Tap to relive the moment</span>
        </div>
      </div>
    </div>
  `).join('');

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxTitle = document.getElementById('lightboxTitle');
  const lightboxSub = document.getElementById('lightboxSub');

  function openLightbox(id) {
    const m = MEMORIES.find((x) => x.id === id);
    if (!m) return;
    lightboxImg.src = m.src;
    lightboxImg.alt = m.place;
    lightboxTitle.textContent = m.title;
    lightboxSub.textContent = m.sub;
    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden', 'false');
  }
  function closeLightbox() {
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden', 'true');
  }

  grid.addEventListener('click', (e) => {
    const card = e.target.closest('.throwback-card');
    if (card) openLightbox(card.dataset.id);
  });
  grid.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      const card = e.target.closest('.throwback-card');
      if (card) { e.preventDefault(); openLightbox(card.dataset.id); }
    }
  });
  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
</script>

</body>
